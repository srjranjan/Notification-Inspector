#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M
kotlin.native.home.jvmargs=-Xmx8192M
kotlin.native.ignoreDisabledTargets=true

#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
versioCode=22

# Library Metadata
libVersion=1.0.22
# Optional staging suffix (e.g., alpha01). Usually overridden by CI for dev builds.
stagingSuffix=

# Pin the published kotlin-stdlib dependency to a version readable by Kotlin 2.2 consumers
# (stdlib is declared explicitly in shared and shared-no-op; see kotlinStdlibCompat in libs.versions.toml)
kotlin.stdlib.default.dependency=false
